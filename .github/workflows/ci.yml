# Checks for work in progress and for every pull request into develop / test / main.
# Pull requests must pass before they can be merged (enable "Require status checks" - see docs/branching.md).
name: ci
on:
  push:
    branches: ["feature/**", "hotfix/**"]
  pull_request:
    branches: [develop, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: promotion-rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check branch flow and version
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: bash scripts/check_promotion.sh "$BASE" "$HEAD"

  tests:
    uses: ./.github/workflows/tests.yml
