# 1.6.8 (#64): the dependency vulnerability checks (pip-audit, npm audit) and the security tests, once a week and on
# demand - so a newly published advisory is noticed between releases, not only when a pull request happens to run.
# A finding fails the run; GitHub then emails the repository owner (Settings -> Notifications -> Actions).
# Scheduled runs use the default branch (main), i.e. what is in production. GitHub pauses schedules in a public
# repository after 60 days without repository activity - it emails first, and "Enable workflow" on the Actions tab
# turns it back on.
name: security
on:
  schedule:
    - cron: "23 11 * * 1"        # Mondays 11:23 UTC (early morning US Central)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: dependency and security checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Dependency vulnerability checks and security tests (AC-SEC-024)
        run: bash scripts/security_check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: build/security
          if-no-files-found: ignore
          retention-days: 30
