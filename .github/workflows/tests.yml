# Reusable: the full verification suite (backend + security tests, typecheck/build, E2E, dependency audits).
# Called by ci.yml (pull requests, feature branches) and build.yml (develop / test / main).
name: tests
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci
      - name: Version consistency (backend config.py = frontend package.json)
        run: bash scripts/version.sh --check
      - name: Third-party notices up to date (v1.5.0 - every shipped dependency listed with its license)
        run: python scripts/third_party_notices.py --check
      - name: Backend tests (AC-mapped, incl. security negative tests)
        run: cd backend && python -m pytest -p no:warnings
      - name: Frontend typecheck + production build
        run: cd frontend && npx tsc --noEmit -p . && npm run build
      - name: E2E UI tests (Playwright)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          FM_PYTHON=python npx playwright test
      - name: Dependency vulnerability checks (AC-SEC-024)
        run: bash scripts/security_check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            build/security
            frontend/e2e-screenshots
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
